<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Afritea Daily Sales Report</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(145deg,#0d2b4e 0%,#1F4E79 50%,#2E75B6 100%);
    min-height:100vh;display:flex;align-items:flex-start;
    justify-content:center;padding:28px 16px 60px;
  }
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 32px rgba(31,78,121,0.15);width:100%;max-width:420px;overflow:hidden}

  /* Header */
  .hdr{background:#1F4E79;padding:26px 28px 20px;position:relative;overflow:hidden}
  .hdr::after{content:'';position:absolute;right:-24px;top:-24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06)}
  .hdr-brand{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:6px}
  .hdr h1{font-size:20px;font-weight:700;color:#fff;line-height:1.2}
  .hdr-date{margin-top:11px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.13);border-radius:30px;padding:5px 14px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.92)}

  /* Rep banner */
  .rep-band{background:#EBF3FB;border-bottom:1px solid #d1dce8;padding:14px 28px}
  .rep-band .name{font-size:16px;font-weight:700;color:#1F4E79;margin-bottom:4px}
  .rep-band .meta{font-size:12px;color:#6b7280;display:flex;gap:14px}

  /* Error */
  .err-wrap{padding:36px 28px;text-align:center}
  .err-wrap h2{color:#C0392B;font-size:17px;margin-bottom:10px}
  .err-wrap p{font-size:14px;color:#6b7280;line-height:1.6}

  /* Form */
  .body{padding:24px 28px 30px}
  .field{margin-bottom:20px}
  .field label{display:block;font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
  .field input{width:100%;border:1.5px solid #d1dce8;border-radius:10px;padding:14px 16px;font-family:'Inter',sans-serif;font-size:15px;color:#1a1a2e;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
  .field input:focus{border-color:#2E75B6;box-shadow:0 0 0 3px rgba(46,117,182,0.12)}
  .money{position:relative}
  .money .pfx{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;color:#6b7280;pointer-events:none}
  .money input{padding-left:54px!important;font-weight:700;font-size:18px;letter-spacing:.3px}

  .btn{width:100%;background:#1F4E79;color:#fff;border:none;border-radius:10px;padding:16px;font-family:'Inter',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s,transform .1s;margin-top:6px}
  .btn:hover{background:#163d61}
  .btn:active{transform:scale(.98)}
  .btn:disabled{background:#93b4d0;cursor:not-allowed}

  .msg{display:none;margin-top:14px;border-radius:10px;padding:14px 16px;font-size:14px;font-weight:500;line-height:1.5}
  .msg.ok{background:#e8f8f1;border:1.5px solid #a3d9bc;color:#1A7A4A}
  .msg.err{background:#fdf0ee;border:1.5px solid #f0a89e;color:#C0392B}

  .spin{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .req{color:#e74c3c;margin-left:2px}
  hr{border:none;border-top:1px solid #d1dce8;margin:20px 0}
</style>
</head>
<body>
<div class="card">

  <div class="hdr">
    <div class="hdr-brand">Afritea Field App</div>
    <h1>Daily Sales Report</h1>
    <div class="hdr-date">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="auto-date"></span>
    </div>
  </div>

  <div id="rep-band" class="rep-band" style="display:none">
    <div class="name" id="d-name"></div>
    <div class="meta">
      <span>📍 <span id="d-region"></span></span>
      <span>🚛 <span id="d-truck"></span></span>
    </div>
  </div>

  <div id="err-wrap" class="err-wrap" style="display:none">
    <h2>Link not recognised</h2>
    <p>Please use the personal link sent to you on WhatsApp. Do not open this page directly.</p>
  </div>

  <div id="form-wrap" style="display:none">
    <div class="body">
      <form id="f" onsubmit="send(event)">

        <div class="field">
          <label>Route / Area worked today <span class="req">*</span></label>
          <input type="text" name="route" placeholder="e.g. Kariakoo, Mbagala..." required autocomplete="off">
        </div>

        <div class="field">
          <label>Total Sales Ex-VAT <span class="req">*</span></label>
          <div class="money">
            <span class="pfx">TZS</span>
            <input type="number" name="sales" placeholder="0" min="0" required>
          </div>
        </div>

        <hr>
        <button class="btn" id="btn" type="submit">Submit Report</button>

        <div class="msg ok" id="m-ok">✅ Submitted! Report recorded for <span id="c-name"></span>.</div>
        <div class="msg err" id="m-err">❌ <span id="e-txt">Something went wrong. Try again.</span></div>
      </form>
    </div>
  </div>

</div>
<script>
  const SCRIPT = 'https://script.google.com/macros/s/AKfycbyhlsR0taqqJGvEu4P-TDlWrLoNQK24z_svUQcYiNJxM67KqKzUUgFLlL31dT-SQCIJNg/exec';

  const today = new Date();
  document.getElementById('auto-date').textContent = today.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  const p      = new URLSearchParams(window.location.search);
  const repName   = p.get('rep');
  const repRegion = p.get('region');
  const repTruck  = p.get('truck');

  if (repName && repRegion) {
    document.getElementById('d-name').textContent   = repName;
    document.getElementById('d-region').textContent = repRegion;
    document.getElementById('d-truck').textContent  = repTruck || '—';
    document.getElementById('c-name').textContent   = repName.split(' ')[0];
    document.getElementById('rep-band').style.display  = 'block';
    document.getElementById('form-wrap').style.display = 'block';
  } else {
    document.getElementById('err-wrap').style.display = 'block';
  }

  async function send(e) {
    e.preventDefault();
    const d   = new FormData(document.getElementById('f'));
    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>Submitting...';
    document.getElementById('m-ok').style.display = 'none';
    document.getElementById('m-err').style.display = 'none';
    try {
      await fetch(SCRIPT, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          date:        today.toLocaleDateString('en-GB'),
          rep_name:    repName,
          region:      repRegion,
          truck:       repTruck || '',
          route:       d.get('route'),
          sales_ex_vat: d.get('sales')
        })
      });
      document.getElementById('m-ok').style.display = 'block';
      document.getElementById('f').reset();
    } catch(err) {
      document.getElementById('e-txt').textContent = 'Network error. Check connection and try again.';
      document.getElementById('m-err').style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Submit Report';
    }
  }
</script>
</body>
</html>
